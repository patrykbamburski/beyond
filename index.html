<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beyond">
<title>Beyond</title>
<style>
:root{
  --bg:#f9f8f6;--s:#fff;--b:#e8e5e0;--b2:#d0ccc5;
  --t:#1a1916;--t2:#6b6660;--t3:#a09b95;
  --green:#3d7a4a;--gbg:#eef5f0;
  --orange:#c4621a;--blue:#185fa5;--purple:#534ab7;
  --mono:ui-monospace,'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif;}

/* TOPBAR */
#bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:200;background:var(--s);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 12px;gap:8px;}
#bar h1{font-family:var(--mono);font-size:13px;font-weight:400;letter-spacing:.08em;color:var(--t2);flex:1;}
.tb{font-family:var(--mono);font-size:11px;color:var(--t3);background:none;border:1px solid var(--b2);padding:4px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.tb.on{background:var(--t);color:var(--s);border-color:var(--t);}
#mode-switcher{display:flex;border:1px solid var(--b2);border-radius:20px;overflow:hidden;flex-shrink:0;}
.mdbtn{font-family:var(--mono);font-size:11px;padding:4px 10px;border:none;background:none;color:var(--t3);cursor:pointer;white-space:nowrap;}
.mdbtn.active{background:var(--t);color:var(--s);}

/* CHIPBAR */
#chipbar{position:fixed;top:48px;left:0;right:0;height:40px;z-index:200;background:var(--s);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:4px;padding:0 10px;overflow-x:auto;scrollbar-width:none;}
#chipbar::-webkit-scrollbar{display:none;}
.kuweta{font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--b2);background:var(--s);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.kuweta.active{background:var(--t);color:var(--s);border-color:var(--t);}

/* DROPDOWN */
.kuw-drop{position:fixed;z-index:300;background:var(--s);border:1px solid var(--b2);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:6px;min-width:180px;display:none;}
.kuw-drop.open{display:block;}
.kuw-item{font-family:var(--mono);font-size:11px;color:var(--t2);padding:7px 10px;border-radius:7px;cursor:grab;display:flex;align-items:center;gap:8px;touch-action:none;}
.kuw-item:hover{background:var(--bg);}
.ki-icon{font-size:13px;flex-shrink:0;}

/* CANVAS */
#cv{position:fixed;top:88px;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;}
#cvbg{position:absolute;inset:0;background-image:radial-gradient(circle,#ccc9c1 1px,transparent 1px);background-size:24px 24px;will-change:transform;}
#cvsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible;}
#cvnodes{position:absolute;top:0;left:0;z-index:2;will-change:transform;}

/* NODE */
.node{position:absolute;background:var(--s);border:1px solid var(--b);border-radius:10px;touch-action:none;min-width:200px;user-select:none;-webkit-user-select:none;}
.node.dragging{box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:50;}
.nh{padding:9px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--b);border-radius:10px 10px 0 0;}
.nih{font-size:13px;line-height:1;flex-shrink:0;}
.ntitle{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--t);flex:1;}
.ndel{width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--t3);font-size:13px;display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:0;}
.node:hover .ndel{opacity:1;}

/* PORT */
.port{position:absolute;width:var(--port-size,20px);height:var(--port-size,20px);border-radius:50%;border:3px solid var(--b2);background:var(--s);cursor:crosshair;z-index:20;touch-action:none;}
.port::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--b2);}
.port.linked::after{background:inherit;}
.port.p-left{left:var(--port-off,-10px);}
.port.p-right{right:var(--port-off,-10px);}
.port.linked{border-width:2px;}
.port.hl{transform:scale(1.5);background:var(--blue)!important;border-color:var(--blue)!important;}

/* DATA ROW */
.drow{display:flex;align-items:center;height:30px;border-bottom:1px solid var(--b);padding:0 12px 0 18px;position:relative;}
.drow:last-child{border-bottom:none;}
.dr-label{font-family:var(--mono);font-size:10px;flex:1;}
.dr-val{font-family:var(--mono);font-size:12px;color:var(--t);}
.dr-goal{font-family:var(--mono);font-size:10px;color:var(--t3);margin-left:2px;}
.dr-port-l{position:absolute;left:-10px;top:50%;margin-top:-10px;}
.dr-port-r{position:absolute;right:-10px;top:50%;margin-top:-10px;}

/* CALORIES top */
.cal-top{padding:10px 12px 8px;border-bottom:1px solid var(--b);}
.cal-big{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--t);line-height:1;}
.cal-sub{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px;}
.prog-bar{height:3px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}

/* PANEL */
.panel-body{padding:10px 12px 10px 18px;position:relative;}
.panel-val{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--t);line-height:1;text-align:center;}
.panel-unit{font-family:var(--mono);font-size:11px;color:var(--t3);text-align:center;margin-top:2px;}
.panel-prog{height:3px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:8px;}
.panel-prog-f{height:100%;border-radius:2px;}

/* NOTE */
.note-body{padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--t2);line-height:1.6;white-space:pre-wrap;min-height:60px;}

/* WATER */
.water-body{padding:10px 12px 10px 18px;position:relative;}
.water-big{font-family:var(--mono);font-size:26px;font-weight:500;color:#185fa5;line-height:1;text-align:center;}
.water-unit{font-family:var(--mono);font-size:11px;color:var(--t3);text-align:center;margin-top:2px;}

/* SUPPLEMENTS */
.supp-body{padding:6px 12px;}
.supp-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--b);cursor:pointer;}
.supp-row:last-child{border-bottom:none;}
.supp-cb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--b2);background:var(--s);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.supp-cb.on{background:var(--green);border-color:var(--green);}
.supp-cb.on::after{content:'';width:8px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.supp-label{font-family:var(--mono);font-size:11px;color:var(--t);flex:1;}
.supp-label.done{color:var(--t3);text-decoration:line-through;}

/* TRACK HISTORY */
.hist-body{padding:6px 0;}
.hist-entry{font-family:var(--mono);font-size:10px;color:var(--t2);padding:5px 12px;border-bottom:1px solid var(--b);line-height:1.6;}
.hist-entry:last-child{border-bottom:none;}
.hist-date{color:var(--t3);font-size:9px;margin-bottom:1px;}
.hist-empty{font-family:var(--mono);font-size:11px;color:var(--t3);padding:14px;text-align:center;line-height:1.7;}
/* dynamic input rows in history */
.hist-in-row{display:flex;align-items:center;height:28px;border-bottom:1px solid var(--b);padding:0 12px 0 18px;position:relative;}
.hist-in-row:last-child{border-bottom:none;}
.hist-in-label{font-family:var(--mono);font-size:10px;color:var(--t3);flex:1;}

/* OVERLAY / MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:flex-end;}
.modal{background:var(--s);border-radius:16px 16px 0 0;width:100%;padding:14px 16px 44px;max-height:85dvh;overflow-y:auto;}
.dh{width:32px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 14px;}
.ml{font-family:var(--mono);font-size:10px;color:var(--t3);display:block;margin:10px 0 4px;letter-spacing:.04em;}
.ml:first-of-type{margin-top:0;}
.mi{width:100%;padding:10px 12px;border:1px solid var(--b2);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--t);background:var(--bg);outline:none;-webkit-appearance:none;}
.mita{width:100%;padding:10px 12px;border:1px solid var(--b2);border-radius:8px;font-family:var(--mono);font-size:13px;color:var(--t);background:var(--bg);outline:none;min-height:80px;resize:vertical;}
.mi:focus,.mita:focus{border-color:var(--t3);}
.mf{display:flex;gap:8px;margin-top:14px;}
.mb{flex:1;padding:12px;border-radius:9px;font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--b2);background:var(--bg);color:var(--t2);}
.mb.p{background:var(--t);color:var(--s);border-color:var(--t);}
.mb.d{color:#b83232;border-color:#f0c0bc;background:#fdf5f5;}

/* GHOST */
.drag-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.75;font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--b2);background:var(--s);color:var(--t2);transform:translate(-50%,-50%);}

/* TOAST + HINT */
/* COMPASS */
#compass{
  position:fixed;bottom:44px;left:12px;z-index:150;
  width:80px;height:80px;
  background:var(--s);border:1px solid var(--b);border-radius:50%;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;
}
#compass svg{width:60px;height:60px;}
#compass-zoom{
  position:fixed;bottom:44px;left:100px;z-index:150;
  display:flex;flex-direction:column;gap:4px;
}
.czoom{
  width:32px;height:32px;background:var(--s);border:1px solid var(--b);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;color:var(--t2);
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  font-family:var(--mono);font-weight:400;
}
.czoom:active{background:var(--bg);}
#compass-scale{
  position:fixed;bottom:132px;left:12px;z-index:150;
  font-family:var(--mono);font-size:9px;color:var(--t3);
  background:var(--s);border:1px solid var(--b);border-radius:20px;
  padding:2px 8px;
}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gbg);color:var(--green);border:1px solid #b8d9c0;font-family:var(--mono);font-size:11px;padding:7px 14px;border-radius:20px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--t3);background:var(--s);padding:4px 12px;border-radius:20px;border:1px solid var(--b);pointer-events:none;z-index:99;white-space:nowrap;}
</style>
</head>
<body>
<div id="bar">
  <h1>beyond</h1>
  <div id="mode-switcher">
    <button class="mdbtn active" data-mode="normal">View</button>
    <button class="mdbtn" data-mode="edit">Edit</button>
    <button class="mdbtn" data-mode="wire">Wire</button>
  </div>
</div>
<div id="chipbar"></div>
<div id="cv">
  <div id="cvbg"></div>
  <svg id="cvsvg"></svg>
  <div id="cvnodes"></div>
  <svg id="cvborder" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;">
    <rect id="world-border" fill="none" stroke="var(--b2)" stroke-width="1.5" stroke-dasharray="8,6" rx="12"/>
  </svg>
</div>
<div id="compass" title="reset view">
  <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- grid lines -->
    <line x1="30" y1="4" x2="30" y2="56" stroke="var(--b)" stroke-width="0.5"/>
    <line x1="4" y1="30" x2="56" y2="30" stroke="var(--b)" stroke-width="0.5"/>
    <circle cx="30" cy="30" r="24" stroke="var(--b)" stroke-width="0.5"/>
    <circle cx="30" cy="30" r="14" stroke="var(--b)" stroke-width="0.5"/>
    <!-- cardinal labels -->
    <text x="30" y="10" text-anchor="middle" font-family="ui-monospace" font-size="7" fill="var(--t3)">N</text>
    <text x="30" y="54" text-anchor="middle" font-family="ui-monospace" font-size="7" fill="var(--t3)">S</text>
    <text x="8" y="33" text-anchor="middle" font-family="ui-monospace" font-size="7" fill="var(--t3)">W</text>
    <text x="52" y="33" text-anchor="middle" font-family="ui-monospace" font-size="7" fill="var(--t3)">E</text>
    <!-- viewport indicator (inner box = current view position) -->
    <rect id="compass-vp" x="20" y="20" width="20" height="20" rx="2"
      fill="var(--blue)" fill-opacity="0.12" stroke="var(--blue)" stroke-width="1"/>
    <!-- center dot -->
    <circle cx="30" cy="30" r="2" fill="var(--t3)"/>
  </svg>
</div>
<div id="compass-zoom">
  <div class="czoom" id="czoom-fit" style="font-size:11px">⊡</div>
</div>
<div id="compass-scale">100%</div>
<div id="toast"></div>
<div id="hint">hold = move · ● = connect · tap = edit</div>

<script>
// ══════════════════════════════════════════
// KUWETY CONFIG
// ══════════════════════════════════════════
const KUWETY = [
  {
    id:'main', label:'Main',
    items:[
      {type:'panel', icon:'□', label:'Panel'},
      {type:'note',  icon:'✏️', label:'Note'},
    ]
  },
  {
    id:'track', label:'Track',
    items:[
      {type:'calories',    icon:'🔥', label:'Calorie Balance'},
      {type:'water',       icon:'💧', label:'Water'},
      {type:'supplements', icon:'💊', label:'Supplements'},
      {type:'trackhistory',icon:'📋', label:'Track History'},
    ]
  },
];

// ══════════════════════════════════════════
// TRACK PORT REGISTRY
// All trackable metrics – each has id, label, unit, color, nodeType
// ══════════════════════════════════════════
const TRACK_PORTS = {
  kcal:    {label:'kcal',    unit:'kcal', color:'#c4621a', nodeType:'calories'},
  protein: {label:'protein', unit:'g',    color:'#534ab7', nodeType:'calories'},
  carbs:   {label:'carbs',   unit:'g',    color:'#b07a18', nodeType:'calories'},
  fat:     {label:'fat',     unit:'g',    color:'#3d7a4a', nodeType:'calories'},
  water:   {label:'water',   unit:'ml',   color:'#185fa5', nodeType:'water'},
};

// Calorie rows (subset of TRACK_PORTS)
const CAL_ROWS = ['kcal','protein','carbs','fat'].map(id=>({id,...TRACK_PORTS[id]}));

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const STOR='bv6';
let S={nodes:[],edges:[],ctr:0};
let mode='normal'; // 'normal' | 'edit' | 'wire'
let TX=0,TY=0,SC=1;

function loadS(){
  try{const r=localStorage.getItem(STOR);if(r){const p=JSON.parse(r);S.nodes=p.nodes||[];S.edges=p.edges||[];S.ctr=p.ctr||0;}}catch(e){}
}
function saveS(){
  try{localStorage.setItem(STOR,JSON.stringify({
    nodes:S.nodes.map(n=>{const c={...n};delete c._el;return c;}),
    edges:S.edges,ctr:S.ctr
  }));}catch(e){}
}

// ══════════════════════════════════════════
// PAN + ZOOM
// ══════════════════════════════════════════
const cv=document.getElementById('cv');
let pans={},pinchD0=0,pinchSC0=1,pinchTX0=0,pinchTY0=0;
let rafId=null;
function applyT(){
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    rafId=null;
    const t=`translate(${TX}px,${TY}px) scale(${SC})`;
    document.getElementById('cvbg').style.transform=t;
    document.getElementById('cvnodes').style.transform=t;
    // scale ports inversely so they stay ~20px on screen regardless of zoom
    const portPx=Math.round(Math.min(28,Math.max(14,20/SC)));
    document.documentElement.style.setProperty('--port-size', portPx+'px');
    document.documentElement.style.setProperty('--port-off', (-portPx/2)+'px');
    // draw edges AFTER transform applied so getBoundingClientRect is correct
    _drawEdgesNow();
    updateBorder&&updateBorder();
    _updateCompassNow();
  });
}
cv.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')||e.target.classList.contains('port'))return;
  pans[e.pointerId]={x:e.clientX,y:e.clientY,tx:TX,ty:TY};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(Object.keys(pans).length===2){
    const pts=Object.values(pans);
    const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
    pinchD0=Math.sqrt(dx*dx+dy*dy);
    pinchSC0=SC;pinchTX0=TX;pinchTY0=TY;
  }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!pans[e.pointerId])return;
  const keys=Object.keys(pans);
  if(keys.length===1){
    const p=pans[e.pointerId];TX=p.tx+(e.clientX-p.x);TY=p.ty+(e.clientY-p.y);applyT();drawEdges();
  } else if(keys.length===2){
    pans[e.pointerId]={...pans[e.pointerId],x:e.clientX,y:e.clientY};
    const pts=Object.values(pans);
    const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y,d=Math.sqrt(dx*dx+dy*dy);
    if(pinchD0>0){
      const ns=Math.min(4,Math.max(0.2,pinchSC0*(d/pinchD0)));
      const mx=(pts[0].x+pts[1].x)/2,my=(pts[0].y+pts[1].y)/2;
      const cr=cv.getBoundingClientRect();
      const ox=mx-cr.left,oy=my-cr.top;
      TX=ox-(ox-pinchTX0)*(ns/pinchSC0);
      TY=oy-(oy-pinchTY0)*(ns/pinchSC0);
      SC=ns;applyT();
    }
  }
},{passive:false});
cv.addEventListener('pointerup',e=>{
  delete pans[e.pointerId];
  pinchD0=0;
  updateCompass();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const cr=cv.getBoundingClientRect(),ox=e.clientX-cr.left,oy=e.clientY-cr.top;
  const ns=Math.min(3,Math.max(0.25,SC*(e.deltaY>0?0.9:1.1)));
  TX=ox-(ox-TX)*(ns/SC);TY=oy-(oy-TY)*(ns/SC);SC=ns;applyT();
},{passive:false});

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function portPos(el){
  const r=el.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  return{x:r.left+r.width/2-cr.left,y:r.top+r.height/2-cr.top};
}
function getNodeVal(nd,metricId){
  // get current value of a metric from a node
  if(nd.type==='calories'){
    const inEdge=S.edges.find(e=>e.to===nd.id&&e.tp===`${metricId}_in`);
    if(!inEdge)return 0;
    const panel=S.nodes.find(n=>n.id===inEdge.from);
    return panel?panel.value||0:0;
  }
  if(nd.type==='water') return nd.value||0;
  return 0;
}
function getGoal(nd,metricId){
  if(nd.type==='calories'){const tp=TRACK_PORTS[metricId];return nd[`${metricId}Goal`]||tp?.default||0;}
  if(nd.type==='water') return nd.goal||2000;
  return 0;
}

// ══════════════════════════════════════════
// EDGES
// ══════════════════════════════════════════
function bez(a,b){const dx=Math.abs(b.x-a.x)*.5;return`M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;}
function _drawEdgesNow(){
  const svg=document.getElementById('cvsvg');
  svg.querySelectorAll('path.edge').forEach(p=>p.remove());
  if(mode==='normal')return;
  S.edges.forEach(edge=>{
    const fn=S.nodes.find(n=>n.id===edge.from),tn=S.nodes.find(n=>n.id===edge.to);
    if(!fn?._el||!tn?._el)return;
    const fp=fn._el.querySelector(`[data-fp="${edge.fp}"]`);
    const tp=tn._el.querySelector(`[data-tp="${edge.tp}"]`);
    if(!fp||!tp)return;
    const a=portPos(fp),b=portPos(tp);
    const color=getEdgeColor(edge);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','edge');path.setAttribute('d',bez(a,b));
    path.setAttribute('fill','none');path.setAttribute('stroke',color);
    path.setAttribute('stroke-width','1.5');path.setAttribute('opacity','0.7');
    svg.appendChild(path);
  });
}
function drawEdges(){applyT();} // triggers RAF which calls _drawEdgesNow
function getEdgeColor(edge){
  const id=edge.fp?.replace('_out','').replace('_in','');
  return TRACK_PORTS[id]?.color||'#888';
}

// ══════════════════════════════════════════
// MAKE PORT ELEMENT
// ══════════════════════════════════════════
function mkPort(side,portKey,color,linked,nd){
  const p=document.createElement('div');
  p.className=`port p-${side==='in'?'left':'right'}${linked?' linked':''}`;
  p.style.borderColor=color;
  if(linked)p.style.background=color+'22';
  if(side==='in') p.dataset.tp=portKey;
  else p.dataset.fp=portKey;
  setupPortEl(p,nd,side,portKey);
  return p;
}

// ══════════════════════════════════════════
// BUILD NODE
// ══════════════════════════════════════════
const ICONS={calories:'🔥',panel:'□',note:'✏️',water:'💧',supplements:'💊',trackhistory:'📋'};

function buildNodeEl(nd){
  const el=document.createElement('div');
  el.className='node';el.style.cssText=`left:${nd.x}px;top:${nd.y}px;`;
  el.dataset.nid=nd.id;nd._el=el;
  const nh=document.createElement('div');nh.className='nh';
  nh.innerHTML=`<span class="nih">${ICONS[nd.type]||'□'}</span><span class="ntitle">${nd.title}</span>`;
  el.appendChild(nh);
  if(nd.type==='calories')    buildCal(nd,el);
  else if(nd.type==='panel')  buildPanel(nd,el);
  else if(nd.type==='note')   buildNote(nd,el);
  else if(nd.type==='water')  buildWater(nd,el);
  else if(nd.type==='supplements') buildSupps(nd,el);
  else if(nd.type==='trackhistory') buildTrackHistory(nd,el);
  setupDragTap(el,nd);
  return el;
}

// ── CALORIES ──────────────────────────────
function buildCal(nd,el){
  const kcalVal=getNodeVal(nd,'kcal');
  const goal=nd.kcalGoal||2200;
  const deficit=goal-kcalVal;
  const pct=Math.min(100,Math.round(kcalVal/goal*100));
  const top=document.createElement('div');top.className='cal-top';
  top.innerHTML=`
    <div class="cal-big">${kcalVal}<span style="font-size:13px;color:var(--t3)"> /${goal}</span></div>
    <div class="cal-sub">${deficit>0?'deficit':'surplus'}: ${Math.abs(deficit)} kcal</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${pct>100?'#b83232':pct>80?'var(--green)':'var(--orange)'}"></div></div>
  `;
  el.appendChild(top);
  CAL_ROWS.forEach(row=>{
    const inLinked=S.edges.some(e=>e.to===nd.id&&e.tp===`${row.id}_in`);
    const outLinked=S.edges.some(e=>e.from===nd.id&&e.fp===`${row.id}_out`);
    if(mode==='normal'&&!inLinked&&!outLinked)return;
    const val=getNodeVal(nd,row.id);
    const g=nd[`${row.id}Goal`]||row.default||0;
    const drow=document.createElement('div');drow.className='drow';
    drow.innerHTML=`<span class="dr-label" style="color:${row.color}">${row.label}</span><span class="dr-val">${val}</span><span class="dr-goal"> /${g}${row.unit}</span>`;
    const inp=mkPort('in',`${row.id}_in`,row.color,inLinked,nd);
    drow.appendChild(inp);
    const outp=mkPort('out',`${row.id}_out`,row.color,outLinked,nd);
    drow.appendChild(outp);
    el.appendChild(drow);
  });
}

// ── PANEL ─────────────────────────────────
function buildPanel(nd,el){
  const outEdge=S.edges.find(e=>e.from===nd.id);
  const inEdge=S.edges.find(e=>e.to===nd.id&&e.tp==='panel_in');
  const portId=outEdge?outEdge.fp?.replace('_in',''):null;
  const tp=portId?TRACK_PORTS[portId]:null;
  // auto-name
  if(tp&&(nd.title==='Panel'||Object.values(TRACK_PORTS).some(t=>t.label===nd.title))){
    nd.title=tp.label;el.querySelector('.ntitle').textContent=nd.title;
  }
  const unit=tp?tp.unit:'';
  const color=tp?tp.color:'var(--t3)';
  let val=nd.value||0,goal=null;
  if(outEdge){
    const calNd=S.nodes.find(n=>n.id===outEdge.to);
    if(calNd)goal=getGoal(calNd,portId);
  }
  if(inEdge){
    // reading from a cal out
    const srcNd=S.nodes.find(n=>n.id===inEdge.from);
    const fp=S.edges.find(e=>e.to===nd.id&&e.tp==='panel_in')?.fp;
    const srcId=fp?.replace('_out','');
    if(srcNd&&srcId){val=getNodeVal(srcNd,srcId);goal=getGoal(srcNd,srcId);}
  }
  const pct=goal?Math.min(100,Math.round(val/goal*100)):0;
  const body=document.createElement('div');body.className='panel-body';
  body.innerHTML=`<div class="panel-val" data-panel-tap style="cursor:text">${val}<span style="font-size:13px;color:var(--t3)">${unit}</span></div>${goal?`<div class="panel-prog"><div class="panel-prog-f" style="width:${pct}%;background:${color}"></div></div>`:''}`;
  el.appendChild(body);
  // inline tap-to-edit in normal mode
  body.querySelector('[data-panel-tap]').addEventListener('pointerup',e=>{
    if(mode!=='normal')return; // edit mode handled by openEdit
    e.stopPropagation();
    openInlineNumber(nd,body.querySelector('[data-panel-tap]'),unit,color);
  });
  // IN port (left) – receives from cal out
  const inLinked=!!inEdge;
  const inColor=inLinked?(TRACK_PORTS[S.edges.find(e=>e.to===nd.id&&e.tp==='panel_in')?.fp?.replace('_out','')]?.color||'var(--b2)'):'var(--b2)';
  const inp=mkPort('in','panel_in',inColor,inLinked,nd);
  inp.style.top='50%';inp.style.marginTop='calc(var(--port-size,20px)/-2)';el.appendChild(inp);
  // OUT port (right) – sends to cal in
  const outLinked=!!outEdge;
  const outColor=tp?tp.color:'var(--b2)';
  const outp=mkPort('out',outEdge?outEdge.fp:'panel_out',outColor,outLinked,nd);
  outp.style.top='50%';outp.style.marginTop='calc(var(--port-size,20px)/-2)';el.appendChild(outp);
}

// ── NOTE ──────────────────────────────────
function buildNote(nd,el){
  const body=document.createElement('div');body.className='note-body';
  body.textContent=nd.text||'tap to edit...';
  body.style.cursor='text';
  body.addEventListener('pointerup',e=>{
    if(mode!=='normal')return;
    e.stopPropagation();
    openInlineText(nd,body);
  });
  el.appendChild(body);
}

// ── WATER ─────────────────────────────────
function buildWater(nd,el){
  const val=nd.value||0,goal=nd.goal||2000;
  const pct=Math.min(100,Math.round(val/goal*100));
  const body=document.createElement('div');body.className='water-body';
  body.innerHTML=`
    <div class="water-big">${val}<span style="font-size:13px;color:var(--t3)"> ml</span></div>
    <div class="water-unit">goal: ${goal} ml</div>
    <div class="prog-bar" style="margin-top:8px"><div class="prog-fill" style="width:${pct}%;background:#185fa5"></div></div>
  `;
  body.style.cursor='text';
  body.addEventListener('pointerup',e=>{
    if(mode!=='normal')return;
    e.stopPropagation();
    openInlineNumber(nd,body.querySelector('.water-big'),'ml','#185fa5',true);
  });
  el.appendChild(body);
  // out port for water metric
  const outLinked=S.edges.some(e=>e.from===nd.id&&e.fp==='water_out');
  const outp=mkPort('out','water_out',TRACK_PORTS.water.color,outLinked,nd);
  outp.style.top='50%';outp.style.marginTop='calc(var(--port-size,20px)/-2)';el.appendChild(outp);
}

// ── SUPPLEMENTS ───────────────────────────
function buildSupps(nd,el){
  const items=nd.items||['Vitamin D','Magnesium','Omega-3','Zinc','B12'];
  const checked=nd.checked||{};
  const body=document.createElement('div');body.className='supp-body';
  items.forEach((item,i)=>{
    const row=document.createElement('div');row.className='supp-row';
    const cb=document.createElement('div');cb.className='supp-cb'+(checked[i]?' on':'');
    const lbl=document.createElement('span');lbl.className='supp-label'+(checked[i]?' done':'');
    lbl.textContent=item;
    row.appendChild(cb);row.appendChild(lbl);
    row.addEventListener('click',e=>{
      if(mode!=='normal')return;
      e.stopPropagation();
      if(!nd.checked)nd.checked={};
      nd.checked[i]=!nd.checked[i];
      saveS();render();
    });
    body.appendChild(row);
  });
  el.appendChild(body);
}

// ── TRACK HISTORY ─────────────────────────
function buildTrackHistory(nd,el){
  // find all connected in-edges (from track nodes out ports)
  const inEdges=S.edges.filter(e=>e.to===nd.id);
  const hist=nd.history||[];

  // show entries or waiting message
  const body=document.createElement('div');body.className='hist-body';
  if(hist.length){
    hist.slice(0,8).forEach(entry=>{
      const div=document.createElement('div');div.className='hist-entry';
      div.innerHTML=`<div class="hist-date">${entry.date}</div><div>${entry.metrics.join(' · ')}</div>`;
      body.appendChild(div);
    });
  } else {
    const msg=inEdges.length?'Next save at 2:59 AM':'No data — connect a track output →';
    body.innerHTML=`<div class="hist-empty">${msg}</div>`;
  }
  el.appendChild(body);

  // dynamic input rows – always show connected ones + one empty slot
  const connectedIds=new Set(inEdges.map(e=>e.fp));
  const availablePorts=Object.entries(TRACK_PORTS).filter(([id])=>!connectedIds.has(`${id}_out`));

  // show connected rows
  inEdges.forEach(edge=>{
    const srcId=edge.fp.replace('_out','');
    const tp=TRACK_PORTS[srcId];if(!tp)return;
    const row=document.createElement('div');row.className='hist-in-row';
    row.innerHTML=`<span class="hist-in-label" style="color:${tp.color}">${tp.label}</span>`;
    const inp=mkPort('in',`${srcId}_hist_in`,tp.color,true,nd);
    row.appendChild(inp);
    el.appendChild(row);
  });

  // one empty slot for next connection
  if(availablePorts.length>0){
    const row=document.createElement('div');row.className='hist-in-row';
    row.innerHTML=`<span class="hist-in-label">+</span>`;
    const inp=mkPort('in','hist_any_in','var(--b2)',false,nd);
    row.appendChild(inp);
    el.appendChild(row);
  }
}

// ══════════════════════════════════════════
// PORT INTERACTION
// ══════════════════════════════════════════
let linking=null,tmpPath=null;

function setupPortEl(portEl,nd,side,portType){
  portEl.addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    if(mode==='normal')return; // wires only in edit mode
    // tap to disconnect
    if(side==='in'){
      const ex=S.edges.find(ed=>ed.to===nd.id&&ed.tp===portType);
      if(ex){S.edges=S.edges.filter(ed=>ed!==ex);saveS();render();toast('disconnected');return;}
    }
    if(side==='out'){
      const ex=S.edges.find(ed=>ed.from===nd.id&&ed.fp===portType);
      if(ex){S.edges=S.edges.filter(ed=>ed!==ex);saveS();render();toast('disconnected');return;}
    }
    linking={nd,side,portType,portEl};
    portEl.classList.add('hl');
    const svg=document.getElementById('cvsvg');
    tmpPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    tmpPath.setAttribute('fill','none');tmpPath.setAttribute('stroke','var(--blue)');
    tmpPath.setAttribute('stroke-width','1.5');tmpPath.setAttribute('stroke-dasharray','5,3');
    svg.appendChild(tmpPath);
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  },{passive:false});
}

cv.addEventListener('pointermove',e=>{
  if(!linking||!tmpPath)return;
  const a=portPos(linking.portEl);if(!a)return;
  const cr=cv.getBoundingClientRect();
  tmpPath.setAttribute('d',bez(a,{x:e.clientX-cr.left,y:e.clientY-cr.top}));
},{passive:false});

cv.addEventListener('pointerup',e=>{
  if(linking){
    // snap: check area around finger tip for nearby port
    let targetPort=null;
    const SNAP=28; // px snap radius
    for(const dx of [-SNAP,0,SNAP]){for(const dy of [-SNAP,0,SNAP]){
      const hit=document.elementFromPoint(e.clientX+dx,e.clientY+dy);
      if(hit?.classList.contains('port')&&hit!==linking.portEl){targetPort=hit;break;}
      if(targetPort)break;
    }}
    // also try exact point
    const exactHit=document.elementFromPoint(e.clientX,e.clientY);
    if(exactHit?.classList.contains('port')&&exactHit!==linking.portEl)targetPort=exactHit;
    const el=targetPort;
    if(el&&el!==linking.portEl){
      const nodeEl=el.closest('.node');
      if(nodeEl){
        const toNd=S.nodes.find(n=>n.id===parseInt(nodeEl.dataset.nid));
        if(toNd){
          const toSide=el.dataset.tp?'in':'out';
          tryConnect(linking,{nd:toNd,side:toSide,portType:el.dataset.tp||el.dataset.fp,portEl:el});
        }
      }
    }
    linking.portEl.classList.remove('hl');
    if(tmpPath){tmpPath.remove();tmpPath=null;}
    linking=null;
  }
});

function tryConnect(from,to){
  if(from.nd.id===to.nd.id)return;
  let fNd=from.nd,fPt=from.portType,tNd=to.nd,tPt=to.portType;
  // normalise to out→in
  if(from.side==='in'&&to.side==='out'){[fNd,fPt,tNd,tPt]=[to.nd,to.portType,from.nd,from.portType];}
  if(from.side===to.side){toast('connect ● to ●');return;}

  // PANEL out → CALORIES in
  if(fNd.type==='panel'&&tNd.type==='calories'&&tPt.endsWith('_in')){
    if(S.edges.find(e=>e.to===tNd.id&&e.tp===tPt)){toast('port busy');return;}
    if(S.edges.find(e=>e.from===fNd.id&&e.fp!=='panel_in'&&!e.fp?.endsWith('_out'))){toast('panel already sending');return;}
    S.edges.push({from:fNd.id,fp:tPt,to:tNd.id,tp:tPt});
    saveS();render();toast('✓ connected');return;
  }

  // CALORIES out → PANEL in
  if(fNd.type==='calories'&&tNd.type==='panel'&&fPt.endsWith('_out')&&tPt==='panel_in'){
    if(S.edges.find(e=>e.to===tNd.id&&e.tp==='panel_in')){toast('panel busy');return;}
    S.edges.push({from:fNd.id,fp:fPt,to:tNd.id,tp:'panel_in'});
    saveS();render();toast('✓ connected');return;
  }

  // WATER out → PANEL in
  if(fNd.type==='water'&&fPt==='water_out'&&tNd.type==='panel'&&tPt==='panel_in'){
    if(S.edges.find(e=>e.to===tNd.id&&e.tp==='panel_in')){toast('panel busy');return;}
    S.edges.push({from:fNd.id,fp:'water_out',to:tNd.id,tp:'panel_in'});
    saveS();render();toast('✓ connected');return;
  }

  // ANY TRACK out → TRACK HISTORY in
  if(tNd.type==='trackhistory'&&fPt.endsWith('_out')){
    const srcId=fPt.replace('_out','');
    const histTp=`${srcId}_hist_in`;
    if(S.edges.find(e=>e.to===tNd.id&&e.tp===histTp)){toast('already tracking');return;}
    S.edges.push({from:fNd.id,fp:fPt,to:tNd.id,tp:histTp});
    saveS();render();toast('✓ tracking');return;
  }

  toast('invalid connection');
}

// ══════════════════════════════════════════
// DRAG + TAP
// ══════════════════════════════════════════
const LONG=220;
function setupDragTap(el,nd){
  let timer=null,dragging=false,moved=false,sx=0,sy=0,nx0=0,ny0=0;
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('port')||e.target.classList.contains('ndel'))return;
    e.stopPropagation();
    sx=e.clientX;sy=e.clientY;nx0=nd.x;ny0=nd.y;moved=false;dragging=false;
    if(mode==='normal')return; // drag only in edit mode
    timer=setTimeout(()=>{
      dragging=true;el.classList.add('dragging');
      try{el.setPointerCapture(e.pointerId);}catch(err){}
    },LONG);
  },{passive:false});
  el.addEventListener('pointermove',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;
    if(!dragging)return;
    nd.x=nx0+dx/SC;nd.y=ny0+dy/SC;
    el.style.left=nd.x+'px';el.style.top=nd.y+'px';drawEdges();
  },{passive:false});
  el.addEventListener('pointerup',e=>{
    clearTimeout(timer);
    if(dragging){el.classList.remove('dragging');saveS();}
    else if(!moved&&mode==='edit')openEdit(nd.id);
    dragging=false;
  });
  el.addEventListener('pointercancel',()=>{clearTimeout(timer);el.classList.remove('dragging');dragging=false;});
}

// RENDER

function render(){
  const cnt=document.getElementById('cvnodes');cnt.innerHTML='';
  S.nodes.forEach(nd=>cnt.appendChild(buildNodeEl(nd)));
  drawEdges();
}

// ══════════════════════════════════════════
// DELETE + ADD
// ══════════════════════════════════════════
function deleteNode(id){
  S.nodes=S.nodes.filter(n=>n.id!==id);
  S.edges=S.edges.filter(e=>e.from!==id&&e.to!==id);
  saveS();render();
}
function addNodeAt(type,x,y){
  const nd={id:S.ctr++,type,x:Math.round(x),y:Math.round(y)};
  if(type==='calories'){nd.title='Calorie Balance';nd.kcalGoal=2200;nd.proteinGoal=150;nd.carbsGoal=250;nd.fatGoal=70;}
  else if(type==='panel'){nd.title='Panel';nd.value=0;}
  else if(type==='note'){nd.title='Note';nd.text='';}
  else if(type==='water'){nd.title='Water';nd.value=0;nd.goal=2000;}
  else if(type==='supplements'){nd.title='Supplements';nd.items=['Vitamin D','Magnesium','Omega-3','Zinc','B12'];nd.checked={};}
  else if(type==='trackhistory'){nd.title='Track History';nd.history=[];}
  S.nodes.push(nd);saveS();render();
}

// ══════════════════════════════════════════
// CHIPBAR + KUWETY
// ══════════════════════════════════════════
function buildChipbar(){
  const bar=document.getElementById('chipbar');
  bar.innerHTML='<span style="font-family:var(--mono);font-size:10px;color:var(--t3);flex-shrink:0;margin-right:4px">+</span>';
  KUWETY.forEach(kuw=>{
    const btn=document.createElement('div');btn.className='kuweta';btn.textContent=kuw.label;
    const drop=document.createElement('div');drop.className='kuw-drop';drop.id=`drop-${kuw.id}`;
    kuw.items.forEach(item=>{
      const row=document.createElement('div');row.className='kuw-item';
      row.innerHTML=`<span class="ki-icon">${item.icon}</span><span>${item.label}</span>`;
      let ghost=null,active=false;
      row.addEventListener('pointerdown',e=>{
        e.stopPropagation();active=true;
        ghost=document.createElement('div');ghost.className='drag-ghost';
        ghost.textContent=item.icon+' '+item.label;document.body.appendChild(ghost);
        ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
        try{row.setPointerCapture(e.pointerId);}catch(err){}
      },{passive:false});
      row.addEventListener('pointermove',e=>{
        if(!active||!ghost)return;
        ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
      },{passive:false});
      row.addEventListener('pointerup',e=>{
        if(!active)return;
        if(ghost){ghost.remove();ghost=null;}active=false;
        closeDrops();
        const cr=cv.getBoundingClientRect();
        if(e.clientY>cr.top){
          addNodeAt(item.type,(e.clientX-cr.left-TX)/SC-100,(e.clientY-cr.top-TY)/SC-40);
        }
      },{passive:false});
      row.addEventListener('pointercancel',()=>{if(ghost)ghost.remove();ghost=null;active=false;});
      drop.appendChild(row);
    });
    document.body.appendChild(drop);
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const isOpen=drop.classList.contains('open');
      closeDrops();
      if(!isOpen){
        const r=btn.getBoundingClientRect();
        drop.style.left=r.left+'px';drop.style.top=(r.bottom+4)+'px';
        drop.classList.add('open');btn.classList.add('active');
      }
    });
    bar.appendChild(btn);
  });
  document.addEventListener('click',closeDrops);
}
function closeDrops(){
  document.querySelectorAll('.kuw-drop').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.kuweta').forEach(k=>k.classList.remove('active'));
}

// EDIT MODAL

// ══════════════════════════════════════════
// INLINE EDIT HELPERS
// ══════════════════════════════════════════
function openInlineNumber(nd, displayEl, unit, color, isWater=false){
  const current=isWater?(nd.value||0):(nd.value||0);
  const inp=document.createElement('input');
  inp.type='number';inp.inputMode='decimal';
  inp.value=current;
  inp.style.cssText=`
    width:100%;font-family:var(--mono);font-size:26px;font-weight:500;
    color:${color};text-align:center;border:none;outline:none;
    background:transparent;-webkit-appearance:none;
    padding:0;margin:0;
  `;
  // replace display with input
  const parent=displayEl.parentElement;
  const clone=displayEl.cloneNode(true);
  parent.replaceChild(inp,displayEl);
  inp.focus();inp.select();

  function commit(){
    const val=parseFloat(inp.value)||0;
    if(isWater)nd.value=val;
    else nd.value=val;
    saveS();render();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){inp.blur();}
    if(e.key==='Escape'){parent.replaceChild(clone,inp);}
  });
}

function openInlineText(nd, displayEl){
  const ta=document.createElement('textarea');
  ta.value=nd.text||'';
  ta.style.cssText=`
    width:100%;font-family:var(--mono);font-size:11px;color:var(--t2);
    line-height:1.6;border:none;outline:none;background:transparent;
    resize:none;padding:0;margin:0;min-height:60px;
  `;
  displayEl.replaceWith(ta);
  ta.focus();
  // auto-resize
  ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';});

  function commit(){
    nd.text=ta.value;saveS();render();
  }
  ta.addEventListener('blur',commit);
  ta.addEventListener('keydown',e=>{if(e.key==='Escape')ta.blur();});
}

function openEdit(id){
  const nd=S.nodes.find(n=>n.id===id);if(!nd)return;
  const ov=document.createElement('div');ov.className='ov';
  let fields='';
  if(nd.type==='calories'){
    fields=CAL_ROWS.map((r,i)=>`<label class="ml">${r.label} goal (${r.unit})</label><input class="mi" id="g${i}" type="number" value="${nd[`${r.id}Goal`]||r.default||0}" inputmode="decimal">`).join('');
  } else if(nd.type==='panel'){
    fields=`<label class="ml">value</label><input class="mi" id="pval" type="number" value="${nd.value||0}" inputmode="decimal">`;
  } else if(nd.type==='note'){
    fields=`<label class="ml">text</label><textarea class="mita" id="ntext">${nd.text||''}</textarea>`;
  } else if(nd.type==='water'){
    fields=`<label class="ml">current (ml)</label><input class="mi" id="wval" type="number" value="${nd.value||0}" inputmode="decimal"><label class="ml">goal (ml)</label><input class="mi" id="wgoal" type="number" value="${nd.goal||2000}" inputmode="decimal">`;
  } else if(nd.type==='supplements'){
    fields=`<label class="ml">items (one per line)</label><textarea class="mita" id="sitems">${(nd.items||[]).join('\n')}</textarea>`;
  }
  // name editable only for panel when not connected, and for note
  const outEdge=S.edges.find(e=>e.from===nd.id);
  const inEdge=S.edges.find(e=>e.to===nd.id&&e.tp==='panel_in');
  const nameEditable=(nd.type==='panel'&&!outEdge&&!inEdge)||(nd.type==='note');
  const nameField=nameEditable
    ? `<label class="ml">name</label><input class="mi" id="etitle" value="${nd.title||''}">`
    : `<label class="ml">name</label><div style="font-family:var(--mono);font-size:13px;color:var(--t2);padding:10px 12px;border:1px solid var(--b);border-radius:8px;background:var(--bg)">${nd.title||''}</div>`;
  ov.innerHTML=`<div class="modal"><div class="dh"></div>${nameField}
    ${fields}
    <div class="mf"><button class="mb d" id="mdel">delete</button><button class="mb" id="mcan">cancel</button><button class="mb p" id="msav">save</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeEdit();});
  document.getElementById('mcan').onclick=closeEdit;
  document.getElementById('mdel').onclick=()=>{deleteNode(id);closeEdit();};
  document.getElementById('msav').onclick=()=>{
    const etitle=document.getElementById('etitle');
    if(etitle)nd.title=etitle.value.trim()||nd.title;
    if(nd.type==='calories'){CAL_ROWS.forEach((r,i)=>{nd[`${r.id}Goal`]=parseFloat(document.getElementById('g'+i).value)||r.default||0;});}
    else if(nd.type==='panel'){nd.value=parseFloat(document.getElementById('pval').value)||0;}
    else if(nd.type==='note'){nd.text=document.getElementById('ntext').value;}
    else if(nd.type==='water'){nd.value=parseFloat(document.getElementById('wval').value)||0;nd.goal=parseFloat(document.getElementById('wgoal').value)||2000;}
    else if(nd.type==='supplements'){nd.items=document.getElementById('sitems').value.split('\n').map(s=>s.trim()).filter(Boolean);nd.checked={};}
    saveS();closeEdit();render();
  };
}
function closeEdit(){document.querySelectorAll('.ov').forEach(o=>o.remove());}

// COMPASS
// ══════════════════════════════════════════
function _updateCompassNow(){
  updateBorder();
  const vp=document.getElementById('compass-vp');
  if(!vp)return;
  const cr=cv.getBoundingClientRect();
  const BOUND=4000;
  const worldW=cr.width/SC,worldH=cr.height/SC;
  const worldX=-TX/SC,worldY=-TY/SC;
  const extent=BOUND,compassSize=48,compassOff=6;
  const vpX=compassOff+(worldX+extent/2)/extent*compassSize;
  const vpY=compassOff+(worldY+extent/2)/extent*compassSize;
  const vpW=Math.max(4,(worldW/extent)*compassSize);
  const vpH=Math.max(4,(worldH/extent)*compassSize);
  vp.setAttribute('x',Math.min(compassOff+compassSize-vpW,Math.max(compassOff,vpX)));
  vp.setAttribute('y',Math.min(compassOff+compassSize-vpH,Math.max(compassOff,vpY)));
  vp.setAttribute('width',Math.min(vpW,compassSize));
  vp.setAttribute('height',Math.min(vpH,compassSize));
  const sc=document.getElementById('compass-scale');
  if(sc)sc.textContent=Math.round(SC*100)+'%';
}
function updateCompass(){applyT();} // deferred via RAF

function updateBorder(){
  const cr=cv.getBoundingClientRect();
  const BOUND=4000;
  // world coords (-BOUND/2 to BOUND/2) mapped to screen
  const x1=TX+(-BOUND/2)*SC, y1=TY+(-BOUND/2)*SC;
  const x2=TX+(BOUND/2)*SC,  y2=TY+(BOUND/2)*SC;
  const rect=document.getElementById('world-border');
  if(rect){
    rect.setAttribute('x',x1);rect.setAttribute('y',y1);
    rect.setAttribute('width',x2-x1);rect.setAttribute('height',y2-y1);
  }
}

function updateCompass(){
  updateBorder();
  const cr=cv.getBoundingClientRect();
  const vw=cr.width,vh=cr.height;
  // canvas bounds in world space
  const worldW=vw/SC,worldH=vh/SC;
  const worldX=-TX/SC,worldY=-TY/SC;
  // estimate total canvas extent (generous)
  const extent=3000;
  // map world pos to compass (60x60 svg, inner 48x48 area)
  const compassSize=48,compassOff=6;
  const vpX=compassOff+(worldX+extent/2)/extent*compassSize;
  const vpY=compassOff+(worldY+extent/2)/extent*compassSize;
  const vpW=Math.max(4,(worldW/extent)*compassSize);
  const vpH=Math.max(4,(worldH/extent)*compassSize);
  const vp=document.getElementById('compass-vp');
  if(vp){
    vp.setAttribute('x',Math.min(compassOff+compassSize-vpW,Math.max(compassOff,vpX)));
    vp.setAttribute('y',Math.min(compassOff+compassSize-vpH,Math.max(compassOff,vpY)));
    vp.setAttribute('width',Math.min(vpW,compassSize));
    vp.setAttribute('height',Math.min(vpH,compassSize));
  }
  const sc=document.getElementById('compass-scale');
  if(sc)sc.textContent=Math.round(SC*100)+'%';
}

// compass click = reset view
document.getElementById('compass').addEventListener('click',()=>{
  TX=0;TY=0;SC=1;applyT();
});

document.getElementById('czoom-fit').addEventListener('click',()=>{
  if(!S.nodes.length){TX=0;TY=0;SC=1;applyT();return;}
  const cr=cv.getBoundingClientRect();
  const xs=S.nodes.map(n=>n.x),ys=S.nodes.map(n=>n.y);
  const minX=Math.min(...xs)-20,minY=Math.min(...ys)-20;
  const maxX=Math.max(...xs)+240,maxY=Math.max(...ys)+200;
  const ww=maxX-minX,wh=maxY-minY;
  const ns=Math.min(4,Math.max(0.2,Math.min((cr.width-40)/ww,(cr.height-40)/wh)));
  TX=-minX*ns+20;TY=-minY*ns+20;SC=ns;
  applyT();drawEdges();updateCompass();
});

// ══════════════════════════════════════════
// RESET + SNAPSHOT @ 2:59 / 3:00
// ══════════════════════════════════════════
function scheduleReset(){
  const now=new Date();
  const snap=new Date(now);snap.setHours(2,59,0,0);if(snap<=now)snap.setDate(snap.getDate()+1);
  const reset=new Date(now);reset.setHours(3,0,5,0);if(reset<=now)reset.setDate(reset.getDate()+1);
  setTimeout(doSnapshot,snap-now);
  setTimeout(()=>{doReset();scheduleReset();},reset-now);
}

function doSnapshot(){
  const today=new Date().toISOString().slice(0,10);
  S.nodes.filter(n=>n.type==='trackhistory').forEach(histNd=>{
    const inEdges=S.edges.filter(e=>e.to===histNd.id);
    if(!inEdges.length)return;
    const metrics=inEdges.map(edge=>{
      const srcId=edge.fp.replace('_out','');
      const tp=TRACK_PORTS[srcId];if(!tp)return null;
      const srcNd=S.nodes.find(n=>n.id===edge.from);if(!srcNd)return null;
      const val=srcNd.type==='water'?srcNd.value||0:getNodeVal(srcNd,srcId);
      const goal=getGoal(srcNd,srcId);
      return`${val}${tp.unit} ${tp.label}${goal?` /${goal}${tp.unit}`:''}`;
    }).filter(Boolean);
    if(!metrics.length)return;
    if(!histNd.history)histNd.history=[];
    const idx=histNd.history.findIndex(h=>h.date===today);
    const entry={date:today,metrics};
    if(idx>=0)histNd.history[idx]=entry;else histNd.history.unshift(entry);
    histNd.history=histNd.history.slice(0,90);
  });
  saveS();render();toast('📋 saved to history');
}

function doReset(){
  // reset panels connected as cal inputs
  S.nodes.filter(n=>n.type==='calories').forEach(cal=>{
    S.edges.filter(e=>e.to===cal.id).forEach(e=>{
      const p=S.nodes.find(n=>n.id===e.from&&n.type==='panel');if(p)p.value=0;
    });
  });
  // reset water
  S.nodes.filter(n=>n.type==='water').forEach(n=>{n.value=0;});
  // reset supplements
  S.nodes.filter(n=>n.type==='supplements').forEach(n=>{n.checked={};});
  saveS();render();toast('↻ reset');
}

function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);
}
