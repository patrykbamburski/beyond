<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beyond">
<meta name="theme-color" content="#f9f8f6">
<title>Beyond</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#f9f8f6;--surface:#fff;--border:#e8e5e0;--border2:#d0ccc5;
  --text:#1a1916;--text2:#6b6660;--text3:#a09b95;
  --green:#3d7a4a;--green-bg:#eef5f0;--orange:#c4621a;
  --radius:10px;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;}

#topbar{
  position:sticky;top:0;z-index:200;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:10px;height:52px;
}
#topbar h1{font-family:var(--mono);font-size:14px;font-weight:400;letter-spacing:.1em;color:var(--text2);flex:1;}
.topbar-btn{
  font-family:var(--mono);font-size:11px;color:var(--text3);
  background:none;border:1px solid var(--border2);
  padding:5px 10px;border-radius:20px;cursor:pointer;
}

#chipbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
}
#chipbar::-webkit-scrollbar{display:none;}
.chip{
  font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:20px;
  border:1px solid var(--border2);background:var(--surface);color:var(--text2);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.chip:active{background:var(--text);color:var(--surface);}

#card-list{
  padding:12px 12px 100px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px;
  align-items:start;
}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-head{padding:10px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.card-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.card-title{font-family:var(--mono);font-size:12px;letter-spacing:.03em;flex:1;color:var(--text);}
.reset-pill{
  font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:20px;
  border:1px solid #e0d8cc;color:var(--text3);pointer-events:none;
}
.reset-pill.on{background:var(--green-bg);color:var(--green);border-color:#b8d9c0;}
.edit-btn{
  width:28px;height:28px;border-radius:6px;background:none;border:none;
  cursor:pointer;color:var(--text3);font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
.edit-btn:active{background:var(--bg);}

.card-body{padding:9px 13px;}
.check-row{
  display:flex;align-items:flex-start;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--border);cursor:pointer;
}
.check-row:last-of-type{border-bottom:none;}
.cb{
  width:18px;height:18px;border-radius:4px;flex-shrink:0;margin-top:1px;
  border:1.5px solid var(--border2);background:var(--surface);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.cb.on{background:var(--green);border-color:var(--green);}
.cb.on::after{content:'';width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.check-label{font-size:14px;line-height:1.4;flex:1;color:var(--text);}
.check-label.done{color:var(--text3);text-decoration:line-through;}

.prog-wrap{margin-top:9px;}
.prog-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px;}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}

.card-text{font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap;font-family:var(--mono);font-weight:300;}

#empty{grid-column:1/-1;padding:70px 20px;text-align:center;}
#empty p{font-family:var(--mono);font-size:12px;color:var(--text3);line-height:2.4;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:flex-end;}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;padding:16px 18px 40px;max-height:90dvh;overflow-y:auto;
}
.drag-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal h2{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.05em;margin-bottom:16px;color:var(--text3);}
.flabel{font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:5px;}
.finput,.ftextarea{
  width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:9px;
  font-family:var(--mono);font-size:14px;font-weight:300;
  color:var(--text);background:var(--bg);margin-bottom:14px;outline:none;
  -webkit-appearance:none;
}
.ftextarea{min-height:100px;resize:vertical;}
.finput:focus,.ftextarea:focus{border-color:var(--text3);}

.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-top:1px solid var(--border);margin-bottom:14px;
}
.toggle-row span{font-family:var(--mono);font-size:12px;color:var(--text2);}
.tgl{position:relative;width:40px;height:22px;}
.tgl input{opacity:0;width:0;height:0;}
.ttrack{position:absolute;inset:0;background:var(--border2);border-radius:11px;cursor:pointer;transition:background .2s;}
.tgl input:checked+.ttrack{background:var(--green);}
.ttrack::before{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;left:2px;top:2px;transition:.2s;}
.tgl input:checked+.ttrack::before{transform:translateX(18px);}

.mfooter{display:flex;gap:8px;margin-top:6px;}
.mbtn{flex:1;padding:13px;border-radius:10px;font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text2);}
.mbtn.primary{background:var(--text);color:var(--surface);border-color:var(--text);}
.mbtn.danger{color:#c0392b;border-color:#f0c0bc;background:#fdf5f5;}

/* INSTALL BANNER - pokazuje się tylko na iOS w Safari */
#install-banner{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:14px 18px 44px;z-index:300;display:none;
}
#install-banner p{font-family:var(--mono);font-size:12px;color:var(--text2);line-height:2;}
#install-banner strong{color:var(--text);}
#install-banner .steps{margin-top:8px;font-size:11px;color:var(--text3);line-height:2.2;}
#install-banner button{
  margin-top:12px;width:100%;padding:13px;border-radius:10px;
  background:var(--text);color:var(--surface);border:none;
  font-family:var(--mono);font-size:12px;cursor:pointer;
}

#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--green-bg);color:var(--green);border:1px solid #b8d9c0;
  font-family:var(--mono);font-size:11px;padding:8px 16px;border-radius:20px;
  z-index:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="topbar">
  <h1>beyond</h1>
  <button class="topbar-btn" id="btn-export">↓ eksport</button>
  <button class="topbar-btn" id="btn-import">↑ import</button>
</div>
<div id="chipbar"></div>
<div id="card-list"></div>

<div id="install-banner">
  <p>Dodaj <strong>Beyond</strong> do ekranu głównego:</p>
  <div class="steps">
    1. Naciśnij <strong>⎋↑</strong> (Udostępnij) na dole Safari<br>
    2. Wybierz <strong>„Dodaj do ekranu głównego"</strong><br>
    3. Gotowe – działa jak apka, dane zostają na telefonie
  </div>
  <button id="install-close">rozumiem ✓</button>
</div>

<div id="toast"></div>

<script>
const KEY='beyond_v1';
const SECTIONS=[
  {type:'todo-day',   label:'zadania · dziś', color:'#888780',checklist:['zadanie 1','zadanie 2'],resettable:true},
  {type:'todo-week',  label:'tydzień',         color:'#6b6660',checklist:['cel tygodnia'],resettable:false},
  {type:'todo-month', label:'miesiąc',         color:'#6b6660',checklist:['cel miesiąca'],resettable:false},
  {type:'todo-year',  label:'rok',             color:'#444',   checklist:['cel roczny'],resettable:false},
  {type:'supplements',label:'suplementy',      color:'#c4621a',checklist:['witamina D','magnez','omega-3','cynk','B12'],resettable:true},
  {type:'calories',   label:'kalorie',         color:'#b07a18',text:'kcal: 0 / 2200\nbiałko: 0g / 150g',resettable:true},
  {type:'finance',    label:'finanse',         color:'#3d7a4a',text:'przychód: —\nkoszty: —\nbilans: —',resettable:false},
  {type:'invest',     label:'inwestycje',      color:'#1a6b56',text:'portfel: —',resettable:false},
  {type:'friends',    label:'rozliczenia',     color:'#534ab7',text:'Jan → +50 zł',resettable:false},
  {type:'ideas',      label:'pomysły',         color:'#993c1d',text:'— pomysł 1',resettable:false},
  {type:'creative',   label:'kreatywna',       color:'#993556',text:'...',resettable:false},
  {type:'shopping',   label:'zakupy',          color:'#185fa5',checklist:['item 1'],resettable:false},
  {type:'training',   label:'trening',         color:'#3d7a4a',text:'pon: klatka\nśr: plecy\npt: nogi',resettable:false},
  {type:'reading',    label:'czytanie',        color:'#444',   checklist:['tytuł 1'],resettable:false},
  {type:'watch',      label:'oglądanie',       color:'#3c3489',checklist:['film 1'],resettable:false},
  {type:'travel',     label:'podróże',         color:'#085041',checklist:['cel 1'],resettable:false},
  {type:'thoughts',   label:'przemyślenia',    color:'#6b6660',text:'...',resettable:false},
];

let state={nodes:[],counter:0,lastReset:''};

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);}catch(e){}
  checkReset();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
function todayKey(){const d=new Date();return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;}
function checkReset(){
  const now=new Date(),key=todayKey();
  if(state.lastReset===key)return;
  if(now.getHours()>=3||!state.lastReset){
    let n=0;
    state.nodes.forEach(nd=>{
      if(nd.resetEnabled&&nd.checklist){nd.checklist=nd.checklist.map(i=>({...i,checked:false}));n++;}
    });
    state.lastReset=key;
    if(n>0)toast('↻ zresetowano o 3:00');
  }
}
function scheduleReset(){
  const now=new Date(),next=new Date(now);
  next.setHours(3,0,5,0);
  if(next<=now)next.setDate(next.getDate()+1);
  setTimeout(()=>{checkReset();save();render();scheduleReset();},next-now);
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

function buildChips(){
  const bar=document.getElementById('chipbar');
  SECTIONS.forEach(s=>{
    const ch=document.createElement('button');
    ch.className='chip';ch.textContent='+ '+s.label;
    ch.onclick=()=>addCard(s.type);
    bar.appendChild(ch);
  });
}

function addCard(type){
  const s=SECTIONS.find(x=>x.type===type);if(!s)return;
  const node={id:state.counter++,type,title:s.label,color:s.color,resetEnabled:false};
  if(s.checklist)node.checklist=s.checklist.map(l=>({label:l,checked:false}));
  else node.text=s.text||'';
  state.nodes.push(node);save();render();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
}

function render(){
  const list=document.getElementById('card-list');
  list.innerHTML='';
  if(!state.nodes.length){
    list.innerHTML='<div id="empty"><p>przesuń pasek powyżej i naciśnij +<br>aby dodać pierwszą kartę</p></div>';
    return;
  }
  state.nodes.forEach(n=>list.appendChild(buildCard(n)));
}

function buildCard(node){
  const s=SECTIONS.find(x=>x.type===node.type)||{};
  const card=document.createElement('div');card.className='card';

  const head=document.createElement('div');head.className='card-head';
  const dot=document.createElement('div');dot.className='card-dot';dot.style.background=node.color;
  const ttl=document.createElement('div');ttl.className='card-title';ttl.textContent=node.title;
  head.appendChild(dot);head.appendChild(ttl);

  if(s.resettable){
    const pill=document.createElement('span');
    pill.className='reset-pill'+(node.resetEnabled?' on':'');
    pill.textContent='↻ 3:00';
    head.appendChild(pill);
  }

  const eb=document.createElement('button');eb.className='edit-btn';eb.textContent='✎';
  eb.onclick=()=>openEdit(node.id);
  head.appendChild(eb);
  card.appendChild(head);

  const body=document.createElement('div');body.className='card-body';
  if(node.checklist){
    node.checklist.forEach((item,i)=>{
      const row=document.createElement('div');row.className='check-row';
      const cb=document.createElement('div');cb.className='cb'+(item.checked?' on':'');
      const lbl=document.createElement('span');lbl.className='check-label'+(item.checked?' done':'');
      lbl.textContent=item.label;
      row.appendChild(cb);row.appendChild(lbl);
      row.onclick=()=>{node.checklist[i].checked=!node.checklist[i].checked;save();render();};
      body.appendChild(row);
    });
    if(s.resettable&&node.checklist.length){
      const done=node.checklist.filter(x=>x.checked).length;
      const pct=Math.round(done/node.checklist.length*100);
      const pw=document.createElement('div');pw.className='prog-wrap';
      pw.innerHTML=`<div class="prog-meta"><span>${done}/${node.checklist.length}</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${pct>=80?'var(--green)':'var(--orange)'}"></div></div>`;
      body.appendChild(pw);
    }
  } else {
    const p=document.createElement('div');p.className='card-text';p.textContent=node.text||'';
    body.appendChild(p);
  }
  card.appendChild(body);
  return card;
}

function openEdit(id){
  const node=state.nodes.find(n=>n.id===id);if(!node)return;
  const s=SECTIONS.find(x=>x.type===node.type)||{};
  const isCL=!!node.checklist;
  const bodyVal=isCL?node.checklist.map(i=>i.label).join('\n'):(node.text||'');

  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <div class="drag-handle"></div>
    <h2>edytuj · ${esc(node.title)}</h2>
    <label class="flabel">tytuł</label>
    <input class="finput" id="e-title" value="${esc(node.title)}">
    <label class="flabel">${isCL?'elementy listy (każdy w nowej linii)':'treść'}</label>
    <textarea class="ftextarea" id="e-body">${esc(bodyVal)}</textarea>
    ${s.resettable?`<div class="toggle-row"><span>reset o 3:00</span><label class="tgl"><input type="checkbox" id="e-reset"${node.resetEnabled?' checked':''}><div class="ttrack"></div></label></div>`:''}
    <div class="mfooter">
      <button class="mbtn danger" id="e-del">usuń</button>
      <button class="mbtn" id="e-cancel">anuluj</button>
      <button class="mbtn primary" id="e-save">zapisz</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)closeEdit();};
  document.getElementById('e-cancel').onclick=closeEdit;
  document.getElementById('e-del').onclick=()=>{
    state.nodes=state.nodes.filter(n=>n.id!==id);
    save();closeEdit();render();
  };
  document.getElementById('e-save').onclick=()=>{
    node.title=document.getElementById('e-title').value.trim()||node.title;
    const bv=document.getElementById('e-body').value;
    if(isCL){
      const prev={};node.checklist.forEach(i=>prev[i.label]=i.checked);
      node.checklist=bv.split('\n').filter(l=>l.trim()).map(l=>({label:l.trim(),checked:prev[l.trim()]||false}));
    } else node.text=bv;
    if(s.resettable){const el=document.getElementById('e-reset');if(el)node.resetEnabled=el.checked;}
    save();closeEdit();render();
  };
}
function closeEdit(){document.querySelectorAll('.overlay').forEach(el=>el.remove());}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

document.getElementById('btn-export').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='beyond_backup.json';a.click();
};
document.getElementById('btn-import').onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{state=JSON.parse(ev.target.result);save();render();toast('✓ wgrano dane');}
      catch(e){alert('Błędny plik JSON');}
    };r.readAsText(f);
  };inp.click();
};

// Banner instalacji - tylko iOS Safari, nie standalone
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
const bannerSeen=localStorage.getItem('beyond_banner');
if(isIOS&&!isStandalone&&!bannerSeen){
  document.getElementById('install-banner').style.display='block';
}
document.getElementById('install-close').onclick=()=>{
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('beyond_banner','1');
};

load();
buildChips();
if(!state.nodes.length){
  addCard('supplements');
  addCard('todo-day');
  addCard('calories');
} else render();
scheduleReset();
</script>
</body>
</html>
